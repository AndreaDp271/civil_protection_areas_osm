<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Protection Areas - OSM</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; background: #f0f0f0; }
        .loader {
            border-top-color: #3498db;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .leaflet-interactive {
            transition: fill-opacity 0.2s, stroke-width 0.2s;
        }
        .leaflet-interactive:hover {
            fill-opacity: 0.6 !important;
            stroke-width: 4px !important;
        }
        .refresh-icon-spin {
            animation: refresh-spin 1.8s linear infinite;
        }
        @keyframes refresh-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Barra di caricamento (non blocca interazioni mappa) -->
    <div id="loader" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[1200] hidden pointer-events-none">
        <div class="bg-slate-900/90 text-white px-4 py-3 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700 backdrop-blur-sm">
            <div class="loader ease-linear rounded-full border-2 border-t-2 border-slate-500 h-5 w-5"></div>
            <p id="loader-text" class="text-xs md:text-sm font-semibold text-center" data-i18n="loading" aria-live="polite">Caricamento...</p>
        </div>
    </div>

    <!-- Barra di Ricerca Superiore -->
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-[1001] w-[90%] max-w-md">
        <div class="bg-white rounded-full shadow-2xl flex items-center px-4 py-2 border border-gray-200">
            <i data-lucide="search" class="text-gray-400 w-5 h-5 mr-2"></i>
            <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="Cerca località..." 
                   class="flex-1 bg-transparent border-none focus:outline-none text-sm text-gray-700 py-1">
            <button onclick="searchLocation()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full transition ml-2">
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>
        <p id="search-help-box" class="mt-2 px-4 py-2 rounded-lg bg-white/90 shadow text-[11px] text-gray-600 border border-gray-200 hidden" data-i18n="search_help">
            Ricerca globale: città o CAP. Per CAP ambigui aggiungi paese ISO2 (es. 42015 it, 90210 us, 28013 es).
        </p>
    </div>

    <!-- Pulsanti laterali + pannelli -->
    <div class="fixed top-40 md:top-20 right-4 z-[1000] flex flex-col items-end gap-3">
        <div class="flex flex-col gap-2">
            <button onclick="toggleLayersPanel()" class="bg-white p-3 rounded-full shadow-xl border border-gray-200 text-slate-700 hover:bg-slate-50 transition" title="Mostra/Nascondi layers">
                <i data-lucide="layers" class="w-5 h-5"></i>
            </button>
            <button onclick="fetchData(true)" class="bg-blue-600 text-white p-3 rounded-full shadow-xl border border-blue-700 hover:bg-blue-700 transition" title="Aggiorna area">
                <i data-lucide="refresh-cw" class="w-5 h-5 refresh-icon-spin"></i>
            </button>
            <button onclick="toggleInfoPanel()" class="bg-white p-3 rounded-full shadow-xl border border-gray-200 text-slate-700 hover:bg-slate-50 transition" title="Mostra/Nascondi dettagli">
                <i data-lucide="info" class="w-5 h-5"></i>
            </button>
        </div>

        <div id="layers-panel" class="bg-white p-5 rounded-xl shadow-2xl border border-gray-200 w-64 md:w-72 hidden">
            <h1 class="text-lg font-bold text-blue-900 flex items-center gap-2 mb-2">
                <i data-lucide="shield-alert"></i> <span data-i18n="title">Emergenza CPA</span>
            </h1>

            <div class="border-t pt-3">
                <p class="text-xs font-bold text-gray-400 mb-3 uppercase" data-i18n="legend_title">Legenda Aree:</p>
                <div class="space-y-2 text-xs">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" checked class="filter-check w-4 h-4 rounded" value="waiting">
                        <span class="w-4 h-4 rounded-sm bg-green-500 border border-green-700"></span>
                        <span class="group-hover:text-blue-600 transition text-gray-700 font-medium" data-i18n="waiting">Attesa</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" checked class="filter-check w-4 h-4 rounded" value="camp">
                        <span class="w-4 h-4 rounded-sm bg-red-600 border border-red-800"></span>
                        <span class="group-hover:text-blue-600 transition text-gray-700 font-medium" data-i18n="camp">Ricovero</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" checked class="filter-check w-4 h-4 rounded" value="staging">
                        <span class="w-4 h-4 rounded-sm bg-yellow-400 border border-yellow-600"></span>
                        <span class="group-hover:text-blue-600 transition text-gray-700 font-medium" data-i18n="staging">Ammassamento</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" checked class="filter-check w-4 h-4 rounded" value="logistic">
                        <span class="w-4 h-4 rounded-sm bg-purple-600 border border-purple-800"></span>
                        <span class="group-hover:text-blue-600 transition text-gray-700 font-medium" data-i18n="logistic">Logistica</span>
                    </label>
                </div>
            </div>
        </div>

        <div id="info-box" class="bg-white p-4 rounded-xl shadow-lg border border-gray-200 w-64 md:w-72 hidden">
            <h3 class="font-bold text-gray-800 border-b pb-2 mb-2 text-xs flex justify-between items-center">
                <span data-i18n="details_title">Dettagli Poligono</span>
                <button onclick="document.getElementById('info-box').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">×</button>
            </h3>
            <div id="info-content" class="text-[10px] space-y-1 text-gray-600 max-h-40 overflow-y-auto font-mono"></div>
        </div>
    </div>

    <div class="fixed bottom-8 left-4 z-[1000]">
        <button onclick="locateUser()" class="bg-white p-3 rounded-full shadow-xl border border-gray-200 text-blue-600 hover:bg-blue-50 transition">
            <i data-lucide="map-pin"></i>
        </button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- LOGICA MULTILINGUA ---
        const dictionary = {
            it: {
                loading: "Caricamento dati in corso...",
                search_placeholder: "Cerca città, CAP o postcode (es: Roma, 42015, 90210 us)...",
                search_help: "Ricerca globale: città o CAP/postcode. Per codici ambigui aggiungi il paese ISO2 (es. 42015 it, 90210 us, 28013 es).",
                title: "Emergenza CPA",
                refresh_btn: "Aggiorna in quest'area",
                legend_title: "Legenda Aree:",
                waiting: "Attesa (Waiting)",
                camp: "Ricovero (camp)",
                staging: "Ammassamento (Staging)",
                logistic: "Logistica (Entry)",
                details_title: "Dettagli Poligono",
                not_found: "Località non trovata.",
                no_data: "Nessun poligono trovato in quest'area.",
                osm_link: "Apri in OSM ↗",
                capacity: "Capacità",
                operator: "Gestore"
            },
            en: {
                loading: "Loading data...",
                search_placeholder: "Search city or postal code (e.g., London, 10001, 90210 us)...",
                search_help: "Global search: city or ZIP/postal code. For ambiguous codes add ISO2 country (e.g., 42015 it, 90210 us, 28013 es).",
                title: "Emergency CPA",
                refresh_btn: "Refresh this area",
                legend_title: "Legend:",
                waiting: "Waiting Area",
                camp: "camp Area",
                staging: "Staging Area",
                logistic: "Logistic Entry",
                details_title: "Polygon Details",
                not_found: "Location not found.",
                no_data: "No CPA polygons found here.",
                osm_link: "Open in OSM ↗",
                capacity: "Capacity",
                operator: "Operator"
            }
        };

        const currentLang = navigator.language.startsWith('it') ? 'it' : 'en';
        const translations = dictionary[currentLang];

        // Inizializza testi UI
        function initTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[key]) el.textContent = translations[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[key]) el.placeholder = translations[key];
            });
        }

        initTranslations();
        lucide.createIcons();

        // Inizializzazione mappa
        const map = L.map('map', { 
            zoomControl: false,
            preferCanvas: true 
        }).setView([45.6717, 11.9276], 14);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const layers = {
            waiting: L.layerGroup().addTo(map),
            camp: L.layerGroup().addTo(map),
            staging: L.layerGroup().addTo(map),
            logistic: L.layerGroup().addTo(map),
            other: L.layerGroup().addTo(map)
        };

        const config = {
            waiting: { color: '#22c55e', label: translations.waiting },
            camp: { color: '#dc2626', label: translations.camp },
            staging: { color: '#eab308', label: translations.staging },
            logistic: { color: '#9333ea', label: translations.logistic }
        };

        const overpassCache = new Map();
        const loadedElementIds = new Set();
        let activeOverpassController = null;
        const overpassEndpoints = [
            "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
            "https://overpass-api.de/api/interpreter",
            "https://overpass.openstreetmap.ru/cgi/interpreter"
        ];

        async function fetchOverpassWithFallback(query, signal) {
            const requestBody = "data=" + encodeURIComponent(query);
            const errors = [];

            for (const endpoint of overpassEndpoints) {
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        body: requestBody,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        signal
                    });

                    if (!response.ok) {
                        errors.push(`${endpoint} -> HTTP ${response.status}`);
                        continue;
                    }

                    return await response.json();
                } catch (error) {
                    if (error.name === 'AbortError') throw error;
                    errors.push(`${endpoint} -> ${error.message}`);
                }
            }

            throw new Error(`Overpass fallback failed: ${errors.join(' | ')}`);
        }

        function updateLoaderText(message) {
            const loaderText = document.getElementById('loader-text');
            loaderText.textContent = message;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function getFeatureName(tags, fallbackIt, fallbackEn) {
            return tags.name || (currentLang === 'it' ? fallbackIt : fallbackEn);
        }

        function isLikelyCAP(value) {
            return /^\d{4,10}$/.test(value.trim());
        }

        function parseCountryHint(value) {
            const match = value.trim().match(/(?:,|\s)([a-zA-Z]{2})$/);
            return match ? match[1].toLowerCase() : null;
        }

        function getSearchCenter() {
            const center = map.getCenter();
            return { lat: center.lat, lon: center.lng };
        }

        function distanceKm(aLat, aLon, bLat, bLon) {
            const toRad = v => (v * Math.PI) / 180;
            const R = 6371;
            const dLat = toRad(bLat - aLat);
            const dLon = toRad(bLon - aLon);
            const lat1 = toRad(aLat);
            const lat2 = toRad(bLat);
            const h = Math.sin(dLat / 2) ** 2 + Math.sin(dLon / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2);
            return 2 * R * Math.asin(Math.sqrt(h));
        }

        function isSettlementResult(item) {
            const placeType = item.type || '';
            const classType = item.class || '';
            const address = item.address || {};
            const hasCityField = Boolean(address.city || address.town || address.village || address.municipality);
            const isPlaceClass = classType === 'place';
            const isKnownSettlement = ['city', 'town', 'village', 'municipality', 'hamlet', 'suburb'].includes(placeType);
            return hasCityField || (isPlaceClass && isKnownSettlement);
        }

        function largeAreaPenalty(item) {
            const placeType = item.type || '';
            const classType = item.class || '';
            const adminLevel = Number(item.address?.admin_level || item.extratags?.admin_level || 0);

            if (classType === 'boundary' && placeType === 'administrative') {
                // Penalizza province/regioni e aree vaste, ma non i comuni.
                if (adminLevel >= 4 && adminLevel <= 7) return 0.9;
                if (adminLevel > 0 && adminLevel < 8) return 0.5;
            }

            if (['state', 'region', 'county', 'province'].includes(placeType)) {
                return 0.7;
            }

            return 0;
        }

        function pickBestResult(results, input, center, isPostalSearch) {
            if (!results.length) return null;

            const normalizedInput = input.trim().toLowerCase();

            const scored = results.map((item, idx) => {
                const lat = Number(item.lat);
                const lon = Number(item.lon);
                const distance = Number.isFinite(lat) && Number.isFinite(lon)
                    ? distanceKm(center.lat, center.lon, lat, lon)
                    : 20000;
                const importance = Number(item.importance) || 0;
                const postcode = (item.address?.postcode || '').toLowerCase();
                const postcodeMatch = isPostalSearch && postcode.replace(/\s/g, '') === normalizedInput ? 1 : 0;
                const settlementBoost = !isPostalSearch && isSettlementResult(item) ? 1 : 0;
                const penalty = !isPostalSearch ? largeAreaPenalty(item) : 0;
                const score = postcodeMatch * 5 + importance + settlementBoost - penalty - Math.min(distance, 3000) / 3000 - idx * 0.02;
                return { item, score };
            });

            scored.sort((a, b) => b.score - a.score);
            return scored[0].item;
        }

        function getCacheKeyFromBounds(bounds, precision = 3) {
            return [
                bounds.getSouth().toFixed(precision),
                bounds.getWest().toFixed(precision),
                bounds.getNorth().toFixed(precision),
                bounds.getEast().toFixed(precision)
            ].join(',');
        }

        async function searchLocation() {
            const input = document.getElementById('search-input').value.trim();
            if (!input) return;

            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');

            try {
                const isPostalSearch = isLikelyCAP(input);
                const countryHint = parseCountryHint(input);
                const normalizedInput = input.replace(/(?:,|\s)[a-zA-Z]{2}$/, '').trim();
                const center = getSearchCenter();
                const baseParams = new URLSearchParams({
                    format: 'jsonv2',
                    addressdetails: '1',
                    limit: '10'
                });

                if (countryHint) {
                    baseParams.set('countrycodes', countryHint);
                }

                const firstParams = new URLSearchParams(baseParams);
                if (isPostalSearch) {
                    firstParams.set('postalcode', normalizedInput);
                } else {
                    firstParams.set('q', normalizedInput);
                }

                let response = await fetch(`https://nominatim.openstreetmap.org/search?${firstParams.toString()}`, {
                    headers: { 'Accept-Language': currentLang }
                });
                let data = await response.json();

                if ((!data || data.length === 0) && isPostalSearch) {
                    const fallbackParams = new URLSearchParams(baseParams);
                    fallbackParams.set('q', normalizedInput);
                    response = await fetch(`https://nominatim.openstreetmap.org/search?${fallbackParams.toString()}`, {
                        headers: { 'Accept-Language': currentLang }
                    });
                    data = await response.json();
                }

                const bestResult = pickBestResult(data || [], normalizedInput, center, isPostalSearch);

                if (bestResult) {
                    map.setView([bestResult.lat, bestResult.lon], 14);
                    fetchData();
                } else {
                    alert(translations.not_found);
                }
            } catch (error) {
                alert('Error');
            } finally {
                loader.classList.add('hidden');
            }
        }

        document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchLocation(); });

        function locateUser() { 
            map.locate({setView: true, maxZoom: 15, timeout: 5000}); 
        }


        function toggleLayersPanel() {
            const panel = document.getElementById('layers-panel');
            panel.classList.toggle('hidden');
        }

        function toggleInfoPanel() {
            const infoPanel = document.getElementById('info-box');
            const searchHelpBox = document.getElementById('search-help-box');
            const isAnyVisible = !infoPanel.classList.contains('hidden') || !searchHelpBox.classList.contains('hidden');

            if (isAnyVisible) {
                infoPanel.classList.add('hidden');
                searchHelpBox.classList.add('hidden');
                return;
            }

            searchHelpBox.classList.remove('hidden');
        }

        function showInfoPanel(contentHtml) {
            const infoBox = document.getElementById('info-box');
            const layersPanel = document.getElementById('layers-panel');
            const searchHelpBox = document.getElementById('search-help-box');
            const infoContent = document.getElementById('info-content');
            layersPanel.classList.add('hidden');
            searchHelpBox.classList.add('hidden');
            infoBox.classList.remove('hidden');
            infoContent.innerHTML = contentHtml;
        }

        function getAreaType(tags) {
            if (tags['emergency:waiting_area'] === 'yes') return 'waiting';
            if (tags['emergency:camp_area'] === 'yes') return 'camp';
            if (tags['emergency:staging_area'] === 'rescue') return 'staging';
            if (tags['emergency:logistic_entry'] === 'rescue') return 'logistic';
            return 'other';
        }

        function createFeature(el) {
            const tags = el.tags || {};
            const type = getAreaType(tags);
            const style = config[type] || { color: '#64748b' };
            if (el.type !== 'way' || !el.geometry) return;
            const coordinates = el.geometry.map(point => [point.lat, point.lon]);
            if (coordinates.length < 3) return; 

            const polygon = L.polygon(coordinates, {
                color: style.color,
                fillColor: style.color,
                fillOpacity: 0.35,
                weight: 3
            });

            const popupContent = `
                <div class="p-1 min-w-[180px]">
                    <div class="text-[9px] uppercase font-black text-gray-400 tracking-tighter">${style.label}</div>
                    <strong class="text-sm block border-b pb-1 mb-1 text-slate-800">${getFeatureName(tags, 'Area Poligonale', 'Polygon Area')}</strong>
                    <div class="text-[11px] text-gray-600">
                        ${tags.operator ? `<div><b>${translations.operator}:</b> ${tags.operator}</div>` : ''}
                        ${tags.capacity ? `<div><b>${translations.capacity}:</b> ${tags.capacity}</div>` : ''}
                    </div>
                    <a href="https://www.openstreetmap.org/way/${el.id}" target="_blank" class="text-blue-600 text-[10px] font-bold mt-2 block hover:underline italic">${translations.osm_link}</a>
                </div>
            `;
            polygon.bindPopup(popupContent);
            polygon.on('click', () => {
                let html = `<div class="font-bold text-slate-800 mb-2 border-b pb-1 text-xs">${tags.name || 'Metadati'}</div>`;
                for (let key in tags) {
                    html += `<div class="flex justify-between gap-3 border-b border-gray-50 py-1">
                        <span class="text-gray-400" style="font-size: 8px;">${key}</span>
                        <span class="text-right font-medium text-slate-700">${tags[key]}</span>
                    </div>`;
                }
                showInfoPanel(html);
            });
            if (layers[type]) polygon.addTo(layers[type]);
            else polygon.addTo(layers.other);
        }

        function createSignFeature(el) {
            const tags = el.tags || {};
            const type = getAreaType(tags);
            if (el.type !== 'node' || !el.lat || !el.lon || tags.man_made !== 'sign' || type === 'other') return;

            const style = config[type] || { color: '#64748b', label: 'Sign' };
            const marker = L.circleMarker([el.lat, el.lon], {
                radius: 7,
                color: '#1f2937',
                weight: 1.5,
                fillColor: style.color,
                fillOpacity: 0.95
            });

            const popupContent = `
                <div class="p-1 min-w-[180px]">
                    <div class="text-[9px] uppercase font-black text-gray-400 tracking-tighter">${style.label} · ${currentLang === 'it' ? 'Cartello' : 'Sign'}</div>
                    <strong class="text-sm block border-b pb-1 mb-1 text-slate-800">${getFeatureName(tags, 'Cartello emergenza', 'Emergency sign')}</strong>
                    <div class="text-[11px] text-gray-600">
                        ${tags.operator ? `<div><b>${translations.operator}:</b> ${tags.operator}</div>` : ''}
                        ${tags.capacity ? `<div><b>${translations.capacity}:</b> ${tags.capacity}</div>` : ''}
                    </div>
                    <a href="https://www.openstreetmap.org/node/${el.id}" target="_blank" class="text-blue-600 text-[10px] font-bold mt-2 block hover:underline italic">${translations.osm_link}</a>
                </div>
            `;

            marker.bindPopup(popupContent);
            marker.on('click', () => {
                let html = `<div class="font-bold text-slate-800 mb-2 border-b pb-1 text-xs">${getFeatureName(tags, 'Cartello emergenza', 'Emergency sign')}</div>`;
                for (let key in tags) {
                    html += `<div class="flex justify-between gap-3 border-b border-gray-50 py-1">
                        <span class="text-gray-400" style="font-size: 8px;">${key}</span>
                        <span class="text-right font-medium text-slate-700">${tags[key]}</span>
                    </div>`;
                }
                showInfoPanel(html);
            });

            marker.addTo(layers[type]);
        }


        function setRefreshSpinning(isSpinning) {
            const refreshIcon = document.getElementById('refresh-icon');
            if (!refreshIcon) return;
            refreshIcon.classList.toggle('refresh-icon-spin-active', isSpinning);
        }

        async function fetchData(forceRefresh = false) {
            const bounds = map.getBounds();
            const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
            const cacheKey = getCacheKeyFromBounds(bounds);
            const cachedData = overpassCache.get(cacheKey);

            if (forceRefresh) {
                overpassCache.clear();
                loadedElementIds.clear();
                Object.values(layers).forEach(l => l.clearLayers());
            }

            if (!forceRefresh && cachedData) {
                renderData(cachedData);
                return;
            }

            const query = `[out:json][timeout:30];
                (
                  way["emergency:waiting_area"="yes"](${bbox});
                  way["emergency:camp_area"="yes"](${bbox});
                  way["emergency:staging_area"="rescue"](${bbox});
                  way["emergency:logistic_entry"="rescue"](${bbox});
                  node["man_made"="sign"]["emergency:waiting_area"="yes"](${bbox});
                  node["man_made"="sign"]["emergency:camp_area"="yes"](${bbox});
                  node["man_made"="sign"]["emergency:staging_area"="rescue"](${bbox});
                  node["man_made"="sign"]["emergency:logistic_entry"="rescue"](${bbox});
                );
                out geom qt;`;
            const loader = document.getElementById('loader');
            updateLoaderText(translations.loading);
            loader.classList.remove('hidden');
            setRefreshSpinning(true);

            if (activeOverpassController) {
                activeOverpassController.abort();
            }

            activeOverpassController = new AbortController();

            const maxRetries = 3;
            try {
                let data = null;

                for (let attempt = 1; attempt <= maxRetries; attempt++) {
                    try {
                        if (attempt > 1) {
                            updateLoaderText(`${translations.loading} (${attempt}/${maxRetries})`);
                        }
                        data = await fetchOverpassWithFallback(query, activeOverpassController.signal);
                        break;
                    } catch (error) {
                        if (error.name === 'AbortError') throw error;
                        if (attempt === maxRetries) throw error;
                        await sleep(800 * attempt);
                    }
                }

                if (data) {
                    overpassCache.set(cacheKey, data);
                    renderData(data);
                }
            } catch (error) {
                if (error.name !== 'AbortError') console.error(error);
            }
            finally {
                setRefreshSpinning(false);
                updateLoaderText(translations.loading);
                loader.classList.add('hidden');
            }
        }

        function renderData(data) {
            if (!data || !Array.isArray(data.elements)) return;
            const features = data.elements.filter(el => el.type === 'way' && el.tags && getAreaType(el.tags) !== 'other');
            const signs = data.elements.filter(el => el.type === 'node' && el.tags && el.tags.man_made === 'sign' && getAreaType(el.tags) !== 'other');

            if (features.length === 0) {
                console.log(translations.no_data);
            } else {
                features.forEach(f => {
                    const uniqueId = `${f.type}:${f.id}`;
                    if (loadedElementIds.has(uniqueId)) return;
                    loadedElementIds.add(uniqueId);
                    createFeature(f);
                });
            }

            signs.forEach(s => {
                const uniqueId = `${s.type}:${s.id}`;
                if (loadedElementIds.has(uniqueId)) return;
                loadedElementIds.add(uniqueId);
                createSignFeature(s);
            });
        }

        document.querySelectorAll('.filter-check').forEach(check => {
            check.addEventListener('change', (e) => {
                const type = e.target.value;
                if (e.target.checked) map.addLayer(layers[type]);
                else map.removeLayer(layers[type]);
            });
        });

        map.on('locationfound', fetchData);
        map.on('locationerror', () => {
            console.log("Geolocalizzazione fallita. Fallback.");
            fetchData();
        });

        let fetchDebounce = null;
        map.on('moveend', () => {
            if (fetchDebounce) clearTimeout(fetchDebounce);
            fetchDebounce = setTimeout(() => fetchData(), 450);
        });

        window.onload = () => {
            locateUser();
            setTimeout(() => {
                if (layers.waiting.getLayers().length === 0) fetchData();
            }, 3000);
        };
    </script>
</body>
</html>
